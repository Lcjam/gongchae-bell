name: gongchae-bell-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gongchae
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d gongchae"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
