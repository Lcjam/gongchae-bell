# promtool test rules: each alert fires on synthetic series, stays quiet below its threshold and resolves.
# Times are minutes from the Unix epoch, so time() is small and epoch gauges are written in seconds from 0.
rule_files:
  - ../rules/gongchae.yml
evaluation_interval: 30s

tests:
  # Deploy switch: one color stops, the other keeps answering -> quiet. Both stop -> fires after 5m, then recovers.
  - interval: 1m
    input_series:
      - series: 'up{job="gongchae-app",instance="app-blue:8081"}'
        values: '1x10 0x10 1x10'
      - series: 'up{job="gongchae-app",instance="app-green:8081"}'
        values: '0x5 1x5 0x20'
    alert_rule_test:
      - {eval_time: 8m, alertname: GongchaeAppMetricsDown, exp_alerts: []}
      - {eval_time: 14m, alertname: GongchaeAppMetricsDown, exp_alerts: []}
      - eval_time: 18m
        alertname: GongchaeAppMetricsDown
        exp_alerts:
          - exp_labels: {severity: critical, summary: "앱 지표 수집 실패 5분 (blue·green 모두 응답 없음)"}
      - {eval_time: 25m, alertname: GongchaeAppMetricsDown, exp_alerts: []}

  # No target at all (scrape config broken): absent() keeps the alert from going silent.
  - interval: 1m
    input_series:
      - series: 'collector_api_stop_limit{job="gongchae-app",instance="app-blue:8081"}'
        values: '900x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: GongchaeAppMetricsDown
        exp_alerts:
          - exp_labels: {job: gongchae-app, severity: critical, summary: "앱 지표 수집 실패 5분 (blue·green 모두 응답 없음)"}

  # Both colors read the same DB and report the same value: one alert, not two.
  # 22-27m: a failed run then one in progress (2 for 5 minutes) -> quiet. 50-70m: two finished failures -> fires.
  - interval: 1m
    input_series:
      - series: 'collector_regular_incomplete_consecutive{job="gongchae-app",instance="app-blue:8081"}'
        values: '0x10 1x10 2x5 0x10 1x10 2x20 0x10'
      - series: 'collector_regular_incomplete_consecutive{job="gongchae-app",instance="app-green:8081"}'
        values: '0x10 1x10 2x5 0x10 1x10 2x20 0x10'
    alert_rule_test:
      - {eval_time: 27m, alertname: GongchaeRegularCollectionFailing, exp_alerts: []}
      - {eval_time: 55m, alertname: GongchaeRegularCollectionFailing, exp_alerts: []}
      - eval_time: 61m
        alertname: GongchaeRegularCollectionFailing
        exp_alerts:
          - exp_labels: {severity: critical, summary: "정기 수집 2회 연속 미완료 (실패 기록)"}
      - {eval_time: 75m, alertname: GongchaeRegularCollectionFailing, exp_alerts: []}

  # Never completed (0) -> quiet. Completes at 180m and 240m, then the 300m and 360m slots leave no COMPLETE run:
  # 240m + 135m = 375m -> fires (for 1m). The 420m run completes -> recovers.
  - interval: 1m
    input_series:
      - series: 'collector_last_complete_epoch{job="gongchae-app",instance="app-blue:8081"}'
        values: '0x179 10800x59 14400x179 25200x30'
    alert_rule_test:
      - {eval_time: 170m, alertname: GongchaeRegularCollectionStale, exp_alerts: []}
      - {eval_time: 300m, alertname: GongchaeRegularCollectionStale, exp_alerts: []}
      - {eval_time: 370m, alertname: GongchaeRegularCollectionStale, exp_alerts: []}
      - eval_time: 378m
        alertname: GongchaeRegularCollectionStale
        exp_alerts:
          - exp_labels: {severity: critical, summary: "정기 수집 2회 연속 미완료 (마지막 완전 수집 2시간 15분 초과)"}
      - {eval_time: 425m, alertname: GongchaeRegularCollectionStale, exp_alerts: []}

  # 10 attempts a minute: 500 at 50m (warning), 900 at 90m (stop). The KST day turns at 101m -> both recover.
  - interval: 1m
    input_series:
      - series: 'collector_api_attempts_today{job="gongchae-app",instance="app-blue:8081"}'
        values: '0+10x90 900x10 1x10'
      - series: 'collector_api_attempts_today{job="gongchae-app",instance="app-green:8081"}'
        values: '0+10x90 900x10 1x10'
      - series: 'collector_api_warning_limit{job="gongchae-app",instance="app-blue:8081"}'
        values: '500x111'
      - series: 'collector_api_stop_limit{job="gongchae-app",instance="app-blue:8081"}'
        values: '900x111'
    alert_rule_test:
      - {eval_time: 49m, alertname: GongchaeApiBudgetWarning, exp_alerts: []}
      - eval_time: 50m
        alertname: GongchaeApiBudgetWarning
        exp_alerts:
          - exp_labels: {severity: warning, summary: "공공데이터 API 일 호출 경고 한도 도달"}
      - {eval_time: 89m, alertname: GongchaeApiBudgetStopped, exp_alerts: []}
      - eval_time: 90m
        alertname: GongchaeApiBudgetStopped
        exp_alerts:
          - exp_labels: {severity: critical, summary: "공공데이터 API 일 호출 차단 한도 도달 (오늘 수집 중단)"}
      - {eval_time: 105m, alertname: GongchaeApiBudgetWarning, exp_alerts: []}
      - {eval_time: 105m, alertname: GongchaeApiBudgetStopped, exp_alerts: []}

  # A lowered COLLECTOR_WARNING_LIMIT moves the alert with it.
  - interval: 1m
    input_series:
      - series: 'collector_api_attempts_today{job="gongchae-app",instance="app-blue:8081"}'
        values: '300x5'
      - series: 'collector_api_warning_limit{job="gongchae-app",instance="app-blue:8081"}'
        values: '300x5'
      - series: 'collector_api_stop_limit{job="gongchae-app",instance="app-blue:8081"}'
        values: '400x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: GongchaeApiBudgetWarning
        exp_alerts:
          - exp_labels: {severity: warning, summary: "공공데이터 API 일 호출 경고 한도 도달"}

  # 1 req/s of 200s; from 10m to 40m six 500s a minute (~9%). Actuator scrapes are left out of both sides.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="gongchae-app",instance="app-blue:8081",uri="/jobs",status="200"}'
        values: '0+60x80'
      - series: 'http_server_requests_seconds_count{job="gongchae-app",instance="app-blue:8081",uri="/jobs",status="500"}'
        values: '0x10 0+6x30 180x40'
      - series: 'http_server_requests_seconds_count{job="gongchae-app",instance="app-blue:8081",uri="/actuator/prometheus",status="500"}'
        values: '0+100x80'
    alert_rule_test:
      - {eval_time: 9m, alertname: GongchaeHttp5xxHigh, exp_alerts: []}
      - {eval_time: 18m, alertname: GongchaeHttp5xxHigh, exp_alerts: []}
      - eval_time: 25m
        alertname: GongchaeHttp5xxHigh
        exp_alerts:
          - exp_labels: {severity: warning, summary: "HTTP 5xx 비율 5% 초과 (10분, 5건 이상)"}
      - {eval_time: 60m, alertname: GongchaeHttp5xxHigh, exp_alerts: []}

  # A quiet site: one 500 among ten requests is 10% but only one error -> quiet.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="gongchae-app",instance="app-blue:8081",uri="/",status="200"}'
        values: '0+1x30'
      - series: 'http_server_requests_seconds_count{job="gongchae-app",instance="app-blue:8081",uri="/",status="500"}'
        values: '0x10 1x20'
    alert_rule_test:
      - {eval_time: 15m, alertname: GongchaeHttp5xxHigh, exp_alerts: []}

  # Dashboard panel "HTTP p95" (root P2). The expression is the panel's, verbatim (MonitoringContractIntegrationTest
  # checks that). Bucket bounds are the app's real ones with maximum-expected-value 30s (same test reads the scrape).
  # 20 s requests read 17.18 + (22.91 - 17.18) * 0.95 = 22.62 s, not the old 10 s bound. Requests past the last finite
  # bucket read as that bound, 30: "30 s or more", beyond the 25 s request budget.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{job="gongchae-app",instance="app-blue:8081",uri="/subscriptions/email",le="17.179869184"}'
        values: '0x10'
      - series: 'http_server_requests_seconds_bucket{job="gongchae-app",instance="app-blue:8081",uri="/subscriptions/email",le="22.906492245"}'
        values: '0+20x10'
      - series: 'http_server_requests_seconds_bucket{job="gongchae-app",instance="app-blue:8081",uri="/subscriptions/email",le="28.633115306"}'
        values: '0+20x10'
      - series: 'http_server_requests_seconds_bucket{job="gongchae-app",instance="app-blue:8081",uri="/subscriptions/email",le="30.0"}'
        values: '0+20x10'
      - series: 'http_server_requests_seconds_bucket{job="gongchae-app",instance="app-blue:8081",uri="/subscriptions/email",le="+Inf"}'
        values: '0+20x10'
      - series: 'http_server_requests_seconds_bucket{job="gongchae-app",instance="app-green:8081",uri="/stalled",le="28.633115306"}'
        values: '0x10'
      - series: 'http_server_requests_seconds_bucket{job="gongchae-app",instance="app-green:8081",uri="/stalled",le="30.0"}'
        values: '0x10'
      - series: 'http_server_requests_seconds_bucket{job="gongchae-app",instance="app-green:8081",uri="/stalled",le="+Inf"}'
        values: '0+5x10'
    promql_expr_test:
      - expr: histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job="gongchae-app",uri!~"/actuator.*"}[5m])))
        eval_time: 10m
        exp_samples:
          - labels: '{uri="/subscriptions/email"}'
            value: 22.62016109195
          - labels: '{uri="/stalled"}'
            value: 30

  # M2 backlog: both colors report the same DB gauge. < 15m spike stays quiet; >= 15m fires once; 0 resolves.
  - interval: 1m
    input_series:
      - series: 'alerts_notification_backlog{job="gongchae-app",instance="app-blue:8081"}'
        values: '0x10 1x10 0x5 2x20 0x10'
      - series: 'alerts_notification_backlog{job="gongchae-app",instance="app-green:8081"}'
        values: '0x10 1x10 0x5 2x20 0x10'
    alert_rule_test:
      - {eval_time: 5m, alertname: GongchaeAlertsBacklog, exp_alerts: []}
      - {eval_time: 19m, alertname: GongchaeAlertsBacklog, exp_alerts: []}
      - {eval_time: 24m, alertname: GongchaeAlertsBacklog, exp_alerts: []}
      - {eval_time: 42m, alertname: GongchaeAlertsBacklog, exp_alerts: []}
      - eval_time: 43m
        alertname: GongchaeAlertsBacklog
        exp_alerts:
          - exp_labels: {severity: warning, summary: "알림 발송 적체 15분 지속 (5분 초과 대기 작업 존재)"}
      - {eval_time: 50m, alertname: GongchaeAlertsBacklog, exp_alerts: []}

  # M2 failed_last1h: deduplicate app-blue/green per kind first.
  # At 7m raw sum would be 8 >= 5, but deduplicated sum (2 + 2 = 4) stays quiet. At 12m (3 + 2 = 5) fires once.
  - interval: 1m
    input_series:
      - series: 'alerts_notification_failed_last1h{job="gongchae-app",instance="app-blue:8081",kind="EMAIL_DIGEST"}'
        values: '0x5 2x5 3x5 2x5'
      - series: 'alerts_notification_failed_last1h{job="gongchae-app",instance="app-green:8081",kind="EMAIL_DIGEST"}'
        values: '0x5 2x5 3x5 2x5'
      - series: 'alerts_notification_failed_last1h{job="gongchae-app",instance="app-blue:8081",kind="DISCORD_NEW"}'
        values: '0x5 2x5 2x5 2x5'
      - series: 'alerts_notification_failed_last1h{job="gongchae-app",instance="app-green:8081",kind="DISCORD_NEW"}'
        values: '0x5 2x5 2x5 2x5'
      - series: 'alerts_notification_failed_last1h{job="gongchae-app",instance="app-blue:8081",kind="EMAIL_CONFIRM"}'
        values: '0x20'
    alert_rule_test:
      - {eval_time: 2m, alertname: GongchaeAlertsFailedHigh, exp_alerts: []}
      - {eval_time: 7m, alertname: GongchaeAlertsFailedHigh, exp_alerts: []}
      - eval_time: 12m
        alertname: GongchaeAlertsFailedHigh
        exp_alerts:
          - exp_labels: {severity: warning, summary: "최근 1시간 알림 발송 실패(FAILED) 5건 이상"}
      - {eval_time: 19m, alertname: GongchaeAlertsFailedHigh, exp_alerts: []}

  # M2 uncertain_last24h: 0 stays quiet; > 0 fires once as warning across both colors; 0 resolves.
  - interval: 1m
    input_series:
      - series: 'alerts_notification_uncertain_last24h{job="gongchae-app",instance="app-blue:8081",kind="DISCORD_NEW"}'
        values: '0x5 1x5 0x5'
      - series: 'alerts_notification_uncertain_last24h{job="gongchae-app",instance="app-green:8081",kind="DISCORD_NEW"}'
        values: '0x5 1x5 0x5'
      - series: 'alerts_notification_uncertain_last24h{job="gongchae-app",instance="app-blue:8081",kind="EMAIL_DIGEST"}'
        values: '0x15'
    alert_rule_test:
      - {eval_time: 2m, alertname: GongchaeAlertsUncertain, exp_alerts: []}
      - eval_time: 7m
        alertname: GongchaeAlertsUncertain
        exp_alerts:
          - exp_labels: {severity: warning, summary: "최근 24시간 알림 발송 결과 불명(UNCERTAIN) 발생 — 재발송 금지"}
      - {eval_time: 12m, alertname: GongchaeAlertsUncertain, exp_alerts: []}

  # Unexposed M2 metrics never fire spuriously.
  - interval: 1m
    input_series:
      - series: 'up{job="gongchae-app",instance="app-blue:8081"}'
        values: '1x20'
    alert_rule_test:
      - {eval_time: 18m, alertname: GongchaeAlertsBacklog, exp_alerts: []}
      - {eval_time: 18m, alertname: GongchaeAlertsFailedHigh, exp_alerts: []}
      - {eval_time: 18m, alertname: GongchaeAlertsUncertain, exp_alerts: []}

  # Dashboard M2 latency mean queries (count/sum/max timers across blue + green, no p95 histogram).
  - interval: 1m
    input_series:
      - series: 'alerts_delivery_latency_seconds_sum{job="gongchae-app",instance="app-blue:8081",kind="EMAIL_DIGEST"}'
        values: '0+10x10'
      - series: 'alerts_delivery_latency_seconds_count{job="gongchae-app",instance="app-blue:8081",kind="EMAIL_DIGEST"}'
        values: '0+2x10'
      - series: 'alerts_delivery_latency_seconds_sum{job="gongchae-app",instance="app-green:8081",kind="EMAIL_DIGEST"}'
        values: '0+20x10'
      - series: 'alerts_delivery_latency_seconds_count{job="gongchae-app",instance="app-green:8081",kind="EMAIL_DIGEST"}'
        values: '0+2x10'
      - series: 'alerts_delivery_collection_latency_seconds_sum{job="gongchae-app",instance="app-blue:8081",kind="DISCORD_NEW"}'
        values: '0+12x10'
      - series: 'alerts_delivery_collection_latency_seconds_count{job="gongchae-app",instance="app-blue:8081",kind="DISCORD_NEW"}'
        values: '0+3x10'
    promql_expr_test:
      - expr: sum by (kind) (rate(alerts_delivery_latency_seconds_sum{job="gongchae-app"}[5m])) / sum by (kind) (rate(alerts_delivery_latency_seconds_count{job="gongchae-app"}[5m]))
        eval_time: 10m
        exp_samples:
          - labels: '{kind="EMAIL_DIGEST"}'
            value: 7.5
      - expr: sum by (kind) (rate(alerts_delivery_collection_latency_seconds_sum{job="gongchae-app"}[5m])) / sum by (kind) (rate(alerts_delivery_collection_latency_seconds_count{job="gongchae-app"}[5m]))
        eval_time: 10m
        exp_samples:
          - labels: '{kind="DISCORD_NEW"}'
            value: 4

  # #15 collector drill isolation (B2): a separate job="gongchae-drill" target fires GongchaeApiBudgetWarning
  # (against active app's collector_api_warning_limit) and GongchaeRegularCollectionFailing (full for: 10m)
  # without masking GongchaeAppMetricsDown if both real app colors go down during the drill window.
  - interval: 1m
    input_series:
      - series: 'up{job="gongchae-app",instance="app-blue:8081"}'
        values: '0x30'
      - series: 'up{job="gongchae-app",instance="app-green:8081"}'
        values: '1x15 0x7 1x8'
      - series: 'up{job="gongchae-drill",instance="drill-exporter:8081"}'
        values: '1x30'
      - series: 'collector_api_warning_limit{job="gongchae-app",instance="app-green:8081"}'
        values: '500x30'
      - series: 'collector_api_stop_limit{job="gongchae-app",instance="app-green:8081"}'
        values: '900x30'
      - series: 'collector_last_complete_epoch{job="gongchae-app",instance="app-green:8081"}'
        values: '0x30'
      - series: 'collector_api_attempts_today{job="gongchae-app",instance="app-green:8081"}'
        values: '0x30'
      - series: 'collector_regular_incomplete_consecutive{job="gongchae-app",instance="app-green:8081"}'
        values: '0x30'
      - series: 'collector_api_attempts_today{job="gongchae-drill",instance="drill-exporter:8081"}'
        values: '0 500x21 0x8'
      - series: 'collector_regular_incomplete_consecutive{job="gongchae-drill",instance="drill-exporter:8081"}'
        values: '0 2x21 0x8'
    alert_rule_test:
      - {eval_time: 0m, alertname: GongchaeApiBudgetWarning, exp_alerts: []}
      - eval_time: 2m
        alertname: GongchaeApiBudgetWarning
        exp_alerts:
          - exp_labels: {severity: warning, summary: "공공데이터 API 일 호출 경고 한도 도달"}
      - {eval_time: 2m, alertname: GongchaeApiBudgetStopped, exp_alerts: []}
      - {eval_time: 2m, alertname: GongchaeRegularCollectionStale, exp_alerts: []}
      - {eval_time: 6m, alertname: GongchaeRegularCollectionFailing, exp_alerts: []}
      - {eval_time: 10m, alertname: GongchaeRegularCollectionFailing, exp_alerts: []}
      - eval_time: 11m
        alertname: GongchaeRegularCollectionFailing
        exp_alerts:
          - exp_labels: {severity: critical, summary: "정기 수집 2회 연속 미완료 (실패 기록)"}
      - {eval_time: 14m, alertname: GongchaeAppMetricsDown, exp_alerts: []}
      - eval_time: 21m
        alertname: GongchaeAppMetricsDown
        exp_alerts:
          - exp_labels: {severity: critical, summary: "앱 지표 수집 실패 5분 (blue·green 모두 응답 없음)"}
      - {eval_time: 26m, alertname: GongchaeApiBudgetWarning, exp_alerts: []}
      - {eval_time: 26m, alertname: GongchaeRegularCollectionFailing, exp_alerts: []}
      - {eval_time: 26m, alertname: GongchaeAppMetricsDown, exp_alerts: []}
