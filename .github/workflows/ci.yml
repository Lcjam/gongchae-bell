name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew --no-daemon check bootJar
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
  deploy-verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Syntax and deploy/G4 unit tests
        run: |
          bash -n deploy/deploy.sh deploy/g4-probe.sh deploy/tests/deploy-test.sh deploy/tests/caddy-integration-test.sh
          ./deploy/tests/deploy-test.sh
      - name: Compose config validation
        env:
          DB_USER: ci
          DB_PASSWORD: ci
          APP_IMAGE: ghcr.io/lcjam/gongchae-bell
          APP_BLUE_TAG: sha-${{ github.sha }}
          APP_GREEN_TAG: sha-${{ github.sha }}
        run: |
          docker compose -f compose.prod.yml --profile blue --profile green config -q
          docker compose -f compose.prod.yml --env-file deploy/.env.prod.example --profile blue --profile green config -q
      - name: Caddyfile validation and live reload/header/redaction test
        run: ./deploy/tests/caddy-integration-test.sh
      - name: Build ARM64 runtime image (no push)
        run: docker build --platform linux/arm64 -t gongchae-bell:ci-${{ github.sha }} .
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
