name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew --no-daemon check bootJar
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
  deploy-verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Syntax and deploy/G4 unit tests
        run: |
          bash -n deploy/deploy.sh deploy/g4-probe.sh deploy/tests/deploy-test.sh deploy/tests/caddy-integration-test.sh
          ./deploy/tests/deploy-test.sh
      - name: Compose config validation
        env:
          DB_USER: ci
          DB_PASSWORD: ci
          APP_IMAGE: ghcr.io/lcjam/gongchae-bell
          APP_BLUE_TAG: sha-${{ github.sha }}
          APP_GREEN_TAG: sha-${{ github.sha }}
        run: |
          docker compose -f compose.prod.yml --profile blue --profile green config -q
          docker compose -f compose.prod.yml --env-file deploy/.env.prod.example --profile blue --profile green config -q
          ALERTS_WORKER_CONCURRENCY=1 ALERTS_BATCH_SIZE=3 ALERTS_SCHEDULER_ENABLED=false \
            docker compose -f compose.prod.yml --profile blue --profile green config --format json \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; expected={"ALERTS_WORKER_CONCURRENCY":"1","ALERTS_BATCH_SIZE":"3","ALERTS_SCHEDULER_ENABLED":"false"}; assert all(s[c]["environment"].get(k)==v for c in ("app-blue","app-green") for k,v in expected.items())'
      - name: Caddyfile validation and live reload/header/redaction test
        run: ./deploy/tests/caddy-integration-test.sh
      - name: Build ARM64 runtime image (no push)
        run: docker build --platform linux/arm64 -t gongchae-bell:ci-${{ github.sha }} .
  backup-verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
      - name: Syntax and backup unit/double tests
        run: |
          bash -n deploy/backup/backup.sh deploy/tests/backup-test.sh deploy/tests/backup-integration-test.sh
          ./deploy/tests/backup-test.sh
      - name: Disposable PostgreSQL 17 and restic restore integration test
        run: ./deploy/tests/backup-integration-test.sh
  pc-pull-verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download checksum-verified restic 0.19.1 portable binary
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "restic-0.19.1"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir "restic_0.19.1_windows_amd64.zip"
          $expected = "da948ad707ed690426473aaba2046cd61f8f90f6f0e7dab6be0d5796531de67d"
          curl.exe -fsSL -o $zip "https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_windows_amd64.zip"
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch: expected=$expected actual=$actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Join-Path $dir "restic_0.19.1_windows_amd64.exe"
          "RESTIC_BIN=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Native Windows PowerShell 5.1 PC pull & wall-clock retention tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/tests/pc-pull-test.ps1 -ResticBin "$env:RESTIC_BIN" -PythonBin python
      - name: Native PowerShell 7 (pwsh) PC pull & default ACL verification
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File deploy/tests/pc-pull-test.ps1 -ResticBin "$env:RESTIC_BIN" -PythonBin python
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
