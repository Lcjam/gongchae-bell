name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew --no-daemon check bootJar
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
  backup-verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
      - name: Syntax and backup unit/double tests
        run: |
          bash -n deploy/backup/backup.sh deploy/tests/backup-test.sh deploy/tests/backup-integration-test.sh
          ./deploy/tests/backup-test.sh
      - name: Disposable PostgreSQL 17 and restic restore integration test
        run: ./deploy/tests/backup-integration-test.sh
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
