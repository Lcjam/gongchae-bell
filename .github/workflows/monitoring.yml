name: Monitoring
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prometheus config, rules and rule tests (promtool)
        run: |
          promtool() { docker run --rm -v "$PWD/deploy/monitoring/prometheus:/w:ro" \
            -v "$PWD/deploy/monitoring/prometheus/rules:/etc/prometheus/rules:ro" -w "$1" --entrypoint promtool prom/prometheus:v3.16.0 "${@:2}"; }
          promtool /w check config prometheus.yml
          promtool /w/tests test rules gongchae.test.yml
  compose-integration:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Overlay on the real compose.prod.yml through deploy.sh (synthetic values, stand-in app image)
        run: deploy/monitoring/tests/compose-integration.sh
      - name: Collector alert drill harness syntax and isolated integration test (#15)
        run: |
          bash -n deploy/monitoring/collector-alert-drill.sh deploy/monitoring/tests/collector-alert-drill-test.sh
          bash deploy/monitoring/tests/collector-alert-drill-test.sh
  alert-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon bootJar
      - name: Alert forwarding on an isolated stack (webhook stub, no real Discord)
        run: deploy/monitoring/tests/alert-e2e.sh
