<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container py-5">
  <section class="hero rounded-4 p-4 p-md-5 mb-5">
    <p class="eyebrow">공공기관 취업의 다음 기회</p>
    <h1 class="display-5 fw-bold">나에게 맞는 공고,<br>기관의 채용 흐름까지.</h1>
    <p class="lead text-secondary mt-3">흩어진 채용 정보를 한곳에서 살펴보세요.</p>
    <div class="d-flex gap-2 flex-wrap mt-4">
      <a class="btn btn-primary" th:href="@{/jobs}">채용공고 둘러보기</a>
      <a class="btn btn-outline-primary" th:href="@{/jobs(career='newcomer')}">신입 지원 가능</a>
      <a class="btn btn-outline-primary" th:href="@{/jobs(ncs='R600020')}">정보통신 직무</a>
    </div>
  </section>
  <section class="mb-5" aria-labelledby="closing-heading">
    <h2 id="closing-heading" class="h4 fw-bold">곧 마감해요 <span class="badge text-bg-light fs-6">D-0 ~ D-3</span></h2>
    <div class="empty-state mt-3">아직 수집된 공고가 없습니다. 첫 수집이 끝나면 마감 임박 공고를 보여 드립니다.</div>
  </section>
  <section aria-labelledby="today-heading">
    <h2 id="today-heading" class="h4 fw-bold">오늘 시작한 공고</h2>
    <div class="empty-state mt-3">아직 수집된 공고가 없습니다.</div>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
