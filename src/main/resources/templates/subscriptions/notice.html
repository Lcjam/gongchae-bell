<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container py-5" style="max-width: 640px;">
  <div class="border rounded-4 bg-white p-4">
    <h1 class="h4 fw-bold mb-3" th:text="${heading}">안내</h1>
    <p class="mb-2" th:text="${message}">내용</p>
    <p class="small text-secondary mb-3" th:if="${detail != null}" th:text="${detail}">자세한 안내</p>
    <div th:if="${manageLink != null}" class="mb-3">
      <p class="small fw-semibold mb-1">관리 링크</p>
      <a class="d-block small text-break" th:href="${manageLink}" th:text="${manageLink}" rel="noreferrer">/subscriptions/manage</a>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-outline-primary btn-sm" th:href="@{/jobs}">채용공고 보기</a>
      <a class="btn btn-link btn-sm" th:href="@{/}">홈으로</a>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
