<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container py-4 py-md-5" style="max-width: 640px;">
  <h1 class="fw-bold mb-4">관리 링크 다시 받기</h1>
  <form method="post" th:action="@{/subscriptions/recover/email}" class="border rounded-4 bg-white p-3 p-md-4 mb-4">
    <h2 class="h6 fw-bold">이메일 구독</h2>
    <label for="recover-email" class="form-label small fw-semibold mb-1">구독한 이메일 주소</label>
    <input id="recover-email" name="email" type="email" maxlength="254" required autocomplete="email" class="form-control mb-3">
    <button type="submit" class="btn btn-primary w-100">관리 링크 메일 받기</button>
  </form>
  <form method="post" th:action="@{/subscriptions/recover/discord}" class="border rounded-4 bg-white p-3 p-md-4">
    <h2 class="h6 fw-bold">디스코드 구독</h2>
    <label for="recover-webhook" class="form-label small fw-semibold mb-1">등록한 웹훅 URL</label>
    <input id="recover-webhook" name="webhook" type="url" maxlength="300" required autocomplete="off" class="form-control mb-3"
           placeholder="https://discord.com/api/webhooks/...">
    <button type="submit" class="btn btn-primary w-100">관리 링크 보기</button>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
