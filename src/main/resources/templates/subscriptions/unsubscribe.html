<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container py-5" style="max-width: 640px;">
  <div class="border rounded-4 bg-white p-4">
    <h1 class="h4 fw-bold mb-3">알림 해지</h1>
    <p class="mb-3">아래 버튼을 누르면 이 구독을 해지하고 구독 정보를 삭제합니다.</p>
    <form method="post" th:action="@{/subscriptions/unsubscribe}">
      <input type="hidden" name="t" th:value="${token}">
      <button type="submit" class="btn btn-outline-danger w-100">해지하기</button>
    </form>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
