<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container py-5" style="max-width: 640px;">
  <div class="border rounded-4 bg-white p-4">
    <h1 class="h4 fw-bold mb-3">알림 신청 확인</h1>
    <p class="mb-3">아래 버튼을 눌러야 알림 신청이 완료됩니다. 링크를 연 것만으로는 신청되지 않습니다.</p>
    <form method="post" th:action="@{/subscriptions/confirm}">
      <input type="hidden" name="t" th:value="${token}">
      <button type="submit" class="btn btn-primary w-100">신청 확인</button>
    </form>
    <p class="small text-secondary mt-3 mb-0">직접 신청하지 않았다면 이 페이지를 닫으세요. 확인하지 않은 신청은 24시간 뒤 삭제됩니다.</p>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
