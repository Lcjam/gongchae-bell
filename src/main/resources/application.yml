spring:
  application:
    name: gongchae-bell
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gongchae}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        # ADR-0014: let a running collection finish for up to 30s on shutdown instead of cutting it off.
        await-termination: true
        await-termination-period: 30s
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  server:
    port: 8081
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      # Buckets for the Prometheus p95 (docs/ops/monitoring.md); the range bounds how many buckets each series gets.
      percentiles-histogram:
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 5ms
      maximum-expected-value:
        "[http.server.requests]": 10s

heartbeat:
  # Healthchecks.io ping URL (ADR-0006). Blank = off. The URL contains the check id: env/Secrets only, never logged.
  collector-url: ${HEARTBEAT_COLLECTOR_URL:}

collector:
  enabled: ${COLLECTOR_ENABLED:false}
  service-key: ${COLLECTOR_SERVICE_KEY:}
  warning-limit: ${COLLECTOR_WARNING_LIMIT:500}
  stop-limit: ${COLLECTOR_STOP_LIMIT:900}
