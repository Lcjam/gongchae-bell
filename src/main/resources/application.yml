spring:
  application:
    name: gongchae-bell
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gongchae}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Bounded pool wait: the in-request alert sends must finish inside their 25 s budget (contract 14-4).
      connection-timeout: 5000  # ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        # ADR-0014: let a running collection finish for up to 30s on shutdown instead of cutting it off.
        await-termination: true
        await-termination-period: 30s
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
server:
  shutdown: graceful
  # ADR-0010: the client address comes from the reverse proxy (Caddy) on the internal network only.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  server:
    port: 8081
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

collector:
  enabled: ${COLLECTOR_ENABLED:false}
  service-key: ${COLLECTOR_SERVICE_KEY:}
  warning-limit: ${COLLECTOR_WARNING_LIMIT:500}
  stop-limit: ${COLLECTOR_STOP_LIMIT:900}

alerts:
  enabled: ${ALERTS_ENABLED:false}
  token-key: ${ALERTS_TOKEN_KEY:}
  hmac-key: ${ALERTS_HMAC_KEY:}
  webhook-key: ${ALERTS_WEBHOOK_KEY:}
  webhook-key-id: ${ALERTS_WEBHOOK_KEY_ID:}
  erasure-log: ${ALERTS_ERASURE_LOG:}
  mail:
    api-key: ${RESEND_API_KEY:}
    from: ${ALERTS_MAIL_FROM:}
  privacy:
    officer: ${PRIVACY_OFFICER:}
    contact: ${PRIVACY_CONTACT:}
    policy-version: ${PRIVACY_POLICY_VERSION:}
    effective-date: ${PRIVACY_EFFECTIVE_DATE:}
    hosting-location: ${PRIVACY_HOSTING_LOCATION:}
    overseas-basis: ${PRIVACY_OVERSEAS_BASIS:}
    resend-retention: ${PRIVACY_RESEND_RETENTION:}
